[project]
name = "websearch-py"
version = "0.2.0"
description = "Resilient multi-engine web search scraper with automatic fallback, engine rotation, smart caching, and standardized JSON output."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Laurent VOLFF", email = "laurentvv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "requests>=2.34.2",
]
keywords = [
    "web-search",
    "search-engine",
    "duckduckgo",
    "bing",
    "google",
    "yahoo",
    "qwant",
    "web-scraping",
    "beautifulsoup4",
    "caching",
    "fallback",
    "rotation",
    "sqlite",
    "json-output",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/laurentvv/websearch-py"
Repository = "https://github.com/laurentvv/websearch-py.git"
Issues = "https://github.com/laurentvv/websearch-py/issues"
Changelog = "https://github.com/laurentvv/websearch-py/releases"

[project.scripts]
websearch = "websearch_py.cli:main"
websearch-py = "websearch_py.cli:main"
web-search = "websearch_py.cli:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-p no:tmpdir"
