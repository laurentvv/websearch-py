<!DOCTYPE html>
<html>
<head><title>DuckDuckGo</title></head>
<body>
<a name="top"></a>
<center id="lite_wrapper">
<a class="header-url" href="/html/"><span class="header">DuckDuckGo</span></a>
<iframe name="ifr" width="0" height="0" border="0" class="hidden"></iframe>
<form id="img-form" action="//duckduckgo.com/anomaly.js?sv=html&amp;cc=botnet&amp;ti=0&amp;gk=TOKEN&amp;q=python&amp;r=eun" target="ifr" method="POST"></form>
<form id="challenge-form" action="//duckduckgo.com/anomaly.js?sv=html&amp;cc=botnet&amp;st=0&amp;gk=TOKEN&amp;q=python&amp;r=eun" method="POST">
<div class="anomaly-modal__mask">
<div class="anomaly-modal__modal  is-ie" data-testid="anomaly-modal">
<div class="anomaly-modal__title">Unfortunately, bots use DuckDuckGo too.</div>
<div class="anomaly-modal__description">Please complete the following challenge to confirm this search was made by a human.</div>
<div class="anomaly-modal__instructions">Select all squares containing a duck:</div>
<div class="anomaly-modal__puzzle-margins">
<div class="anomaly-modal__puzzle">
<div class="anomaly-modal__box" data-index="0"><label for="image-check_0"><input class="anomaly-modal__check" id="image-check_0" name="image-check_0" type="checkbox"/></label></div>
<div class="anomaly-modal__box" data-index="1"><label for="image-check_1"><input class="anomaly-modal__check" id="image-check_1" name="image-check_1" type="checkbox"/></label></div>
</div>
</div>
<div class="anomaly-modal__controls">
<button name="challenge-submit" class="btn btn--primary anomaly-modal__submit js-anomaly-modal-submit" form="challenge-form" value="TOKEN">Submit</button>
</div>
</div>
</div>
</form>
</center>
</body>
</html>
